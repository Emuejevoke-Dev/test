<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: auto;
    }

    .container {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin: 20px auto;
    }

    .card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #0078d7;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Random User Generator</h1>

    <div id="user-card" class="card">
      <p>Click the button to load a random user.</p>
    </div>

    <button id="fetch-user">Get Random User</button>
  </div>

  <script>
    const button = document.getElementById("fetch-user");
    const userCard = document.getElementById("user-card");

    button.addEventListener("click", function () {

      fetch("https://randomuser.me/api/")
        .then(response => response.json())
        .then(data => {

          const user = data.results[0];

          userCard.innerHTML = `
            <img src="${user.picture.large}" alt="User">
            <h2>${user.name.first} ${user.name.last}</h2>
            <p><strong>Email:</strong> ${user.email}</p>
            <p><strong>Phone:</strong> ${user.phone}</p>
            <p><strong>Age:</strong> ${user.dob.age}</p>
            <p><strong>Country:</strong> ${user.location.country}</p>
          `;
        })
        .catch(error => {
          console.error(error);
          userCard.innerHTML = "<p>Failed to load user.</p>";
        });

    });
  </script>

</body>
</html>
